<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- תאילנד 2026 - גלעד והדר (Pure Vector Squircle Icon like Zmanim) -->
  <defs>
    <linearGradient id="bgCanopy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F6E66" />
      <stop offset="100%" stop-color="#083B37" />
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#042421" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgCanopy)" stroke="#14857B" stroke-width="5" />

  <!-- Golden Tropical Sun / Crescent -->
  <circle cx="256" cy="215" r="96" fill="url(#goldSun)" filter="url(#softGlow)" />

  <!-- Andaman Sea Waves & Longtail Boat Silhouette (Pure Vector Paths, Zero Text Fonts) -->
  <path d="M 86 348 C 156 312, 356 312, 426 348 L 426 388 C 356 352, 156 352, 86 388 Z" fill="#A7F3D0" opacity="0.9" />
  <path d="M 116 406 C 186 376, 326 376, 396 406 L 396 436 C 326 406, 186 406, 116 436 Z" fill="#34D399" opacity="0.85" />
  <path d="M 160 285 L 352 285 L 322 322 L 190 322 Z" fill="#FAF7F2" filter="url(#softGlow)" />
</svg>
